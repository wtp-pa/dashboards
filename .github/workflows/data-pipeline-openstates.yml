name: Data Pipeline (OpenStates)

on:
  schedule:
    # Primary run: 3rd of month at 06:00 UTC. Avoids the 1st-of-month
    # traffic spike that chronically 429s the free tier (see 2026-06-01
    # incident). PA roll-call votes cluster around session days, not
    # calendar weeks, so monthly cadence matches the actual rhythm.
    - cron: "0 6 3 * *"
    # Fallback run: 8th of month. Picks up the data if the 3rd run
    # still hit rate limits — commit step is a no-op if nothing changed.
    - cron: "0 6 8 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # GITHUB_TOKEN pushes don't trigger downstream `on: push` workflows, so
  # we explicitly dispatch pages-deploy.yml after a successful data commit.
  actions: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch PA bills from OpenStates
        continue-on-error: true
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: python pipeline/legislation/fetch_bills.py

      - name: Match bills against WTPPPA platform
        continue-on-error: true
        run: python pipeline/legislation/match_bills.py

      - name: Refresh PA legislator roster from OpenStates
        continue-on-error: true
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: python pipeline/elected-officials/fetch_officials.py

      - name: Fetch PA roll-call votes from OpenStates
        continue-on-error: true
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: python pipeline/elected-officials/fetch_votes.py

      - name: Score officials against platform
        continue-on-error: true
        run: python pipeline/elected-officials/score_officials.py

      - name: Run accuracy tests (data + integration)
        continue-on-error: true
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: python3 tests/run.py --integration

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "wtp-budget-watch-bot"
          git config user.email "noreply@wtpppa.org"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: scheduled pipeline update (monthly OpenStates)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
